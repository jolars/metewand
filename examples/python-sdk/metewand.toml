version = 1
name = "python-sdk"

[datasets.numbers]
output_schema = "schemas/dataset.json"
runner = "command"
program = "python3"
args = ["{sources}/worker.py", "dataset_materializer"]
sources = ["worker.py", "metewand/*.py"]
environment = "local"
parameter_schema = "schemas/dataset-parameters.json"
parameter_defaults = { values = [1, 2, 3] }

[problems.sum]
contract = "problem.toml"
parameter_defaults = { offset = 2 }

[problems.sum.evaluator]
runner = "command"
program = "python3"
args = ["{sources}/worker.py", "problem_evaluator"]
sources = ["worker.py", "metewand/*.py"]
environment = "local"

[implementations.reference]
runner = "command"
program = "python3"
args = ["{sources}/worker.py", "implementation"]
sources = ["worker.py", "metewand/*.py"]
environment = "local"
problem_contracts = ["sum"]
capabilities = ["one_shot"]

[environments.local]
kind = "local"

[[experiments]]
name = "main"
problem = "sum"
datasets = ["numbers"]
implementations = ["reference"]
execution_policy = "local"
observation_policy = "final"
implementation_repetitions = 1
measurement_repetitions = 2
seed = 7

[execution_policies.local]
version = 1
timing_scope = "prepare_and_execute"
worker_reuse = true

[observation_policies.final]
version = 1
kind = "one_shot"
