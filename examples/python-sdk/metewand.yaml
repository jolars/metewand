version: 1
name: "python-sdk"
datasets:
  numbers:
    output-schema: &dataset-schema
      type: object
      properties:
        schema_version: { const: 1 }
        complete: { const: true }
        files:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            properties: { path: { const: "data.json" } }
            required: [path]
      required: [schema_version, complete, files]
    runner: "command"
    program: "python3"
    args: ["{sources}/worker.py", "dataset_materializer"]
    sources: ["worker.py", "metewand/*.py"]
    environment: "local"
    parameter-schema:
      type: object
      properties:
        values: { type: array, items: { type: integer }, minItems: 1 }
      required: [values]
      additionalProperties: false
    parameter-defaults: { values: [1, 2, 3] }
problems:
  sum:
    contract:
      version: 1
      name: sum
      family: arithmetic
      parameter-schema:
        type: object
        properties: { offset: { type: integer } }
        required: [offset]
        additionalProperties: false
      dataset-schemas: [*dataset-schema]
      result-schema:
        type: object
        properties: { answer: { type: integer } }
        required: [answer]
        additionalProperties: false
      metric-schema:
        type: object
        properties: { absolute_error: { type: integer, minimum: 0 } }
        required: [absolute_error]
        additionalProperties: false
      semantics-schema:
        type: object
        properties:
          preprocessing:
            type: object
            properties:
              shared_materialization: { const: canonical_integer_json }
              implementation_conversion: { const: preserve_integer_values_and_order }
              allowed_outside_timed_scope:
                type: array
                items: { enum: [integer_packing] }
                uniqueItems: true
            required: [shared_materialization, implementation_conversion, allowed_outside_timed_scope]
            additionalProperties: false
          validity: { $ref: "#/$defs/exact" }
          one_shot_completion: { $ref: "#/$defs/exact" }
        required: [preprocessing, validity, one_shot_completion]
        additionalProperties: false
        $defs:
          exact:
            type: object
            properties: { exact_sum: { const: true } }
            required: [exact_sum]
            additionalProperties: false
      allowed-timing-scopes: [prepare_and_execute]
      supported-budgets: [none]
      semantics:
        preprocessing:
          shared_materialization: canonical_integer_json
          implementation_conversion: preserve_integer_values_and_order
          allowed_outside_timed_scope: []
        validity: { exact_sum: true }
        one_shot_completion: { exact_sum: true }
      reference-cases:
        - dataset: data.json
          result: reference/result.json
          expected-metrics: reference/metrics.json
    parameter-defaults: { offset: 2 }
    evaluator:
      runner: "command"
      program: "python3"
      args: ["{sources}/worker.py", "problem_evaluator"]
      sources: ["worker.py", "metewand/*.py"]
      environment: "local"
implementations:
  reference:
    runner: "command"
    program: "python3"
    args: ["{sources}/worker.py", "implementation"]
    sources: ["worker.py", "metewand/*.py"]
    environment: "local"
    problem-contracts: ["sum"]
    capabilities: ["one_shot"]
environments:
  local:
    kind: "local"
experiments:
  - name: "main"
    problem: "sum"
    datasets: ["numbers"]
    implementations: ["reference"]
    execution-policy: "local"
    observation-policy: "final"
    implementation-repetitions: 1
    measurement-repetitions: 2
    seed: 7
execution-policies:
  local:
    version: 1
    timing-scope: "prepare_and_execute"
    worker-reuse: true
observation-policies:
  final:
    version: 1
    kind: "one_shot"
