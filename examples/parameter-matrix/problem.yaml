version: 1
name: "sum"
family: "arithmetic"
parameters:
  offset: {type: integer, default: 2}
dataset-schemas: ["schemas/dataset.json"]
result:
  answer: integer
metrics:
  absolute_error: {type: integer, minimum: 0}
semantics-schema: "schemas/semantics.json"
allowed-timing-scopes: ["prepare_and_execute"]
supported-budgets: ["none"]
semantics:
  preprocessing:
    shared_materialization: "canonical_integer_json"
    implementation_conversion: "preserve_integer_values_and_order"
    allowed_outside_timed_scope: []
  validity:
    exact_sum: true
  one_shot_completion:
    exact_sum: true
reference-cases:
  - dataset: "data.json"
    result: "reference/result.json"
    expected-metrics: "reference/metrics.json"
