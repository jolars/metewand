version: 1
name: "parameter-matrix"
datasets:
  numbers:
    output-schema: "schemas/dataset.json"
    runner: "command"
    program: "python3"
    args: ["{sources}/worker.py", "dataset_materializer"]
    sources: ["worker.py"]
    environment: "local"
    parameters:
      values:
        type: array
        items: integer
        minItems: 1
        grid: [[1, 2, 3], [4, 6]]
problems:
  sum:
    contract: "problem.yaml"
    evaluator:
      runner: "command"
      program: "python3"
      args: ["{sources}/worker.py", "problem_evaluator"]
      sources: ["worker.py"]
      environment: "local"
implementations:
  reference:
    parameters:
      representation:
        type: string
        enum: [list, packed]
        default: list
    runner: "command"
    program: "python3"
    args: ["{sources}/worker.py", "implementation"]
    sources: ["worker.py"]
    environment: "local"
    problem-contracts: ["sum"]
    capabilities: ["one_shot"]
environments:
  local:
    kind: "local"
experiments:
  - name: "main"
    problem: "sum"
    datasets: ["numbers"]
    implementations: ["reference"]
    execution-policy: "local"
    observation-policy: "final"
    implementation-repetitions: 1
    measurement-repetitions: 1
    seed: 7
    implementation-parameters:
      reference:
        representation: { grid: ["list", "packed"] }
    cases:
      - name: "cartesian"
        problem-parameters:
          offset: { grid: [0, 2] }
      - name: "coupled"
        dataset-parameters:
          numbers:
            values: { value: [10, 10] }
        problem-parameters:
          offset: 1
execution-policies:
  local:
    version: 1
    timing-scope: "prepare_and_execute"
    primary-time: "timed_wall_time"
observation-policies:
  final:
    version: 1
    kind: "one_shot"
