version: 1
name: "r-sdk"
datasets:
  numbers:
    output_schema: "schemas/dataset.json"
    runner: "command"
    program: "Rscript"
    args: ["--vanilla", "{sources}/worker.R", "dataset_materializer"]
    sources: ["worker.R", "library/metewand/**"]
    environment: "local"
    parameter_schema: "schemas/dataset-parameters.json"
    parameter_defaults: { values: [1, 2, 3] }
problems:
  sum:
    contract: "problem.yaml"
    parameter_defaults: { offset: 2 }
    evaluator:
      runner: "command"
      program: "Rscript"
      args: ["--vanilla", "{sources}/worker.R", "problem_evaluator"]
      sources: ["worker.R", "library/metewand/**"]
      environment: "local"
implementations:
  reference:
    runner: "command"
    program: "Rscript"
    args: ["--vanilla", "{sources}/worker.R", "implementation"]
    sources: ["worker.R", "library/metewand/**"]
    environment: "local"
    problem_contracts: ["sum"]
    capabilities: ["one_shot"]
environments:
  local:
    kind: "local"
experiments:
  - name: "main"
    problem: "sum"
    datasets: ["numbers"]
    implementations: ["reference"]
    execution_policy: "local"
    observation_policy: "final"
    implementation_repetitions: 1
    measurement_repetitions: 2
    seed: 7
execution_policies:
  local:
    version: 1
    timing_scope: "prepare_and_execute"
    worker_reuse: true
observation_policies:
  final:
    version: 1
    kind: "one_shot"
