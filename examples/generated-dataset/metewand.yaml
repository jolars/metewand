version: 1
name: "generated-dataset"
datasets:
  numbers:
    output-schema: "schemas/dataset.json"
    runner: "command"
    program: "python3"
    args: ["{sources}/worker.py", "dataset_materializer"]
    sources: ["worker.py"]
    environment: "local"
    parameter-schema: "schemas/dataset-parameters.json"
    parameter-defaults: { values: [1, 2, 3] }
problems:
  sum:
    contract: "problem.yaml"
    parameter-defaults: { offset: 2 }
    evaluator:
      runner: "command"
      program: "python3"
      args: ["{sources}/worker.py", "problem_evaluator"]
      sources: ["worker.py"]
      environment: "local"
implementations:
  reference:
    runner: "command"
    program: "python3"
    args: ["{sources}/worker.py", "implementation"]
    sources: ["worker.py"]
    environment: "local"
    problem-contracts: ["sum"]
    capabilities: ["one_shot"]
  packed:
    runner: "command"
    program: "python3"
    args: ["{sources}/worker.py", "implementation", "packed"]
    sources: ["worker.py"]
    environment: "local"
    problem-contracts: ["sum"]
    capabilities: ["one_shot"]
environments:
  local:
    kind: "local"
experiments:
  - name: "main"
    problem: "sum"
    datasets: ["numbers"]
    implementations: ["reference", "packed"]
    execution-policy: "local"
    observation-policy: "final"
    implementation-repetitions: 1
    measurement-repetitions: 1
    seed: 7
execution-policies:
  local:
    version: 1
    timing-scope: "prepare_and_execute"
    primary-time: "timed_wall_time"
observation-policies:
  final:
    version: 1
    kind: "one_shot"
