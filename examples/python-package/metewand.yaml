version: 1
name: "python-package"
datasets:
  numbers:
    output-schema: &dataset-schema
      type: object
      properties:
        schema_version: { const: 1 }
        complete: { const: true }
        files:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            properties: { path: { const: "data.json" } }
            required: [path]
      required: [schema_version, complete, files]
    runner: python
    entrypoint: worker.py
    args: [dataset_materializer]
    sources: ["worker.py", "metewand/*.py"]
    parameters:
      values:
        type: array
        items: { type: integer }
        minItems: 1
        default: [1, 2, 3]
problems:
  sum:
    family: arithmetic
    parameters:
      offset: { type: integer, default: 2 }
    dataset-schemas: [*dataset-schema]
    result:
      answer: integer
    metrics:
      absolute_error: { type: integer, minimum: 0 }
    allowed-timing-scopes: [prepare_and_execute]
    supported-budgets: [none]
    semantics:
      preprocessing:
        shared_materialization: canonical_integer_json
        implementation_conversion: preserve_integer_values_and_order
        allowed_outside_timed_scope: []
      validity: { finite_integer: true }
      one_shot_completion: { absolute_error: 0 }
    reference-cases:
      - dataset: data.json
        result: reference/result.json
        expected-metrics: reference/metrics.json
    evaluator:
      runner: python
      entrypoint: worker.py
      args: [problem_evaluator]
      sources: ["worker.py", "metewand/*.py"]
implementations:
  reference:
    runner: python
    entrypoint: worker.py
    args: [implementation]
    sources: ["worker.py", "metewand/*.py"]
    problem-contracts: ["sum"]
    capabilities: ["one_shot"]
experiments:
  - name: "main"
    problem: "sum"
    datasets: ["numbers"]
    implementations: ["reference"]
    execution-policy: "local"
    observation-policy: "final"
    measurement-repetitions: 2
    seed: 7
execution-policies:
  local:
    timing-scope: "prepare_and_execute"
    primary-time: "timed_wall_time"
    worker-reuse: true
observation-policies:
  final:
    kind: "one_shot"
