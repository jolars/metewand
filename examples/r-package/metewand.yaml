version: 1
name: "r-package"
datasets:
  numbers:
    output-schema: "schemas/dataset.json"
    runner: "command"
    protocol-transport: socket
    program: "Rscript"
    args: ["--vanilla", "{sources}/worker.R", "dataset_materializer"]
    sources: ["worker.R", "library/metewand/**"]
    environment: "local"
    parameter-schema: "schemas/dataset-parameters.json"
    parameter-defaults: { values: [1, 2, 3] }
problems:
  sum:
    contract: "problem.yaml"
    parameter-defaults: { offset: 2 }
    evaluator:
      runner: "command"
      protocol-transport: socket
      program: "Rscript"
      args: ["--vanilla", "{sources}/worker.R", "problem_evaluator"]
      sources: ["worker.R", "library/metewand/**"]
      environment: "local"
implementations:
  reference:
    runner: "command"
    protocol-transport: socket
    program: "Rscript"
    args: ["--vanilla", "{sources}/worker.R", "implementation"]
    sources: ["worker.R", "library/metewand/**"]
    environment: "local"
    problem-contracts: ["sum"]
    capabilities: ["one_shot"]
environments:
  local:
    kind: "local"
experiments:
  - name: "main"
    problem: "sum"
    datasets: ["numbers"]
    implementations: ["reference"]
    execution-policy: "local"
    observation-policy: "final"
    implementation-repetitions: 1
    measurement-repetitions: 2
    seed: 7
execution-policies:
  local:
    version: 1
    timing-scope: "prepare_and_execute"
    primary-time: "timed_wall_time"
    worker-reuse: true
observation-policies:
  final:
    version: 1
    kind: "one_shot"
