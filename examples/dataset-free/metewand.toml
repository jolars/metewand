version = 1
name = "dataset-free"

[problems.sum]
contract = "problem.toml"
parameter_defaults = { n = 3 }

[problems.sum.evaluator]
runner = "command"
program = "python3"
args = ["{sources}/worker.py", "problem_evaluator"]
sources = ["worker.py"]
environment = "local"

[implementations.reference]
runner = "command"
program = "python3"
args = ["{sources}/worker.py", "implementation"]
sources = ["worker.py"]
environment = "local"
problem_contracts = ["sum"]
capabilities = ["one_shot"]

[environments.local]
kind = "local"

[[experiments]]
name = "main"
problem = "sum"
implementations = ["reference"]
execution_policy = "local"
observation_policy = "final"
implementation_repetitions = 1
measurement_repetitions = 1
seed = 7

[execution_policies.local]
version = 1
timing_scope = "prepare_and_execute"

[observation_policies.final]
version = 1
kind = "one_shot"

[experiments.problem_parameters]
n = { grid = [3, 10] }
