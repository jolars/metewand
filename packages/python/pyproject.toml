[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metewand"
version = "0.2.0"
description = "Define Metewand benchmarks with Python functions"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-*"]
authors = [{name = "Johan Larsson", email = "johan@jolars.co"}]
readme = "README.md"
dependencies = []

[project.urls]
Homepage = "https://metewand.org"
Documentation = "https://metewand.org/guide/getting-started"
Repository = "https://github.com/jolars/metewand"
Issues = "https://github.com/jolars/metewand/issues"

[tool.setuptools.packages.find]
where = ["src"]
