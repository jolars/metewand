[workspace]
resolver = "3"
members = [
    "crates/metewand-cli",
    "crates/metewand-core",
    "crates/metewand-protocol",
    "crates/metewand-runtime",
]

# Keep backtrace line numbers without copying full debug data into every test binary.
[profile.test]
debug = "line-tables-only"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98.0"
authors = ["Johan Larsson <johan@jolars.co>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jolars/metewand"
readme = "README.md"
publish = false

[workspace.dependencies]
flate2 = "1.1"
fluent-uri = "0.4.1"
globset = "0.4.16"
jsonschema = { version = "0.59.0", default-features = false }
metewand-core = { path = "crates/metewand-core" }
metewand-protocol = { path = "crates/metewand-protocol" }
metewand-runtime = { path = "crates/metewand-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_canonicalizer = "0.4.1"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize", "serialize"] }
serde_path_to_error = "0.1.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustix = { version = "1.1.4", features = ["fs", "pipe"] }
sha2 = "0.11.1"
tar = "0.4"
tempfile = "3.20.0"
thiserror = "2.0.20"
yaml-edit = "0.3.5"
