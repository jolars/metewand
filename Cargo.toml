[workspace]
resolver = "3"
members = [
    "crates/metewand-cli",
    "crates/metewand-core",
    "crates/metewand-protocol",
    "crates/metewand-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
authors = ["Johan Larsson <johan@jolars.co>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jolars/metewand"
readme = "README.md"
publish = false

[workspace.dependencies]
metewand-core = { path = "crates/metewand-core" }
metewand-protocol = { path = "crates/metewand-protocol" }
metewand-runtime = { path = "crates/metewand-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
thiserror = "2.0.20"
