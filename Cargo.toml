[package]
name = "metewand"
version = "0.2.0"
description = "Reproducible computational benchmarks across languages"
edition = "2024"
rust-version = "1.98.0"
authors = ["Johan Larsson <johan@jolars.co>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jolars/metewand"
homepage = "https://metewand.org"
readme = "README.md"
publish = ["crates-io"]
keywords = ["benchmark", "reproducibility", "statistics"]
categories = ["command-line-utilities", "development-tools::profiling", "science"]
autolib = false
autotests = false
autoexamples = false
include = ["/src/", "/schemas/**/*.schema.json", "/LICENSE-*", "/README.md"]

[package.metadata.dist]
dist = true

[[bin]]
name = "metewand"
path = "src/main.rs"
test = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[profile.dist]
inherits = "release"
lto = "thin"

# Keep backtrace line numbers without copying full debug data into every test binary.
[profile.test]
debug = "line-tables-only"

[dependencies]
flate2 = "1.1"
fluent-uri = "0.4.1"
getrandom = "0.4"
globset = "0.4.16"
jsonschema = { version = "0.59.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_canonicalizer = "0.4.1"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize", "serialize"] }
serde_path_to_error = "0.1.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.11.1"
tar = "0.4"
tempfile = "3.20.0"
thiserror = "2.0.20"
yaml-edit = "0.3.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs", "pipe"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["trace"] }

[[example]]
name = "datamonger"
path = "examples/datamonger/main.rs"

[[example]]
name = "rust-worker"
path = "examples/rust-worker/main.rs"

[[example]]
name = "buffered-worker"
path = "examples/buffered-profile/main.rs"

[[example]]
name = "streaming-worker"
path = "examples/streaming-profile/main.rs"

[[example]]
name = "overhead-worker"
path = "examples/overhead/main.rs"
