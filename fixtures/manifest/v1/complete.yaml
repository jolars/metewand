version: 1
name: "complete-benchmark"
datasets:
  fixed:
    output-schema: "schemas/dataset.json"
    sources: ["datasets/fixed/**"]
  generated:
    parameter-schema: "schemas/generator.json"
    parameter-defaults: { rows: 100 }
    output-schema: "schemas/dataset.json"
    runner: "python"
    entrypoint: "datasets/generate.py"
    args: ["--quiet"]
    sources: ["datasets/generate.py"]
    environment: "python"
    protocol-transport: "pipes"
  command:
    output-schema: "schemas/dataset.json"
    runner: "command"
    program: "bin/generate"
    environment: "native"
    source:
      url: "https://example.org/source.tar.zst"
      sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
problems:
  example:
    contract: "problems/example.yaml"
    parameter-defaults: { centered: true }
    evaluator:
      runner: "julia"
      entrypoint: "problems/evaluate.jl"
      sources: ["problems/evaluate.jl"]
      environment: "julia"
      protocol-transport: "stdio"
implementations:
  interpreted:
    runner: "r"
    entrypoint: "implementations/solve.R"
    sources: ["implementations/solve.R"]
    environment: "r"
    problem-contracts: ["example"]
    parameter-schema: "schemas/implementation.json"
    parameter-defaults: { tolerance: 1e-8 }
    capabilities: ["one_shot"]
  command:
    runner: "command"
    program: "bin/solve"
    args: ["--worker"]
    sources: ["implementations/config.toml"]
    environment: "native"
    problem-contracts: ["example"]
    capabilities: ["one_shot"]
environments:
  local:
    kind: "local"
  python:
    kind: "uv"
    project: "environments/python"
    lockfile: "environments/python/uv.lock"
  r:
    kind: "renv"
    project: "environments/r"
    lockfile: "environments/r/renv.lock"
  julia:
    kind: "oci"
    image: "example.org/julia@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
  native:
    kind: "nix"
    flake: "."
    installable: ".#native"
    system: "x86_64-linux"
    output-kind: "app"
    output: "native"
experiments:
  - name: "main"
    problem: "example"
    datasets: ["fixed", "generated", "command"]
    implementations: ["interpreted", "command"]
    execution-policy: "controlled"
    observation-policy: "final"
    implementation-repetitions: 2
    measurement-repetitions: 3
    seed: 2025
    dataset-parameters:
      generated:
        rows: { grid: [100, 200] }
    problem-parameters:
      centered: { value: true }
    implementation-parameters:
      interpreted:
        tolerance: { value: 1e-7 }
    cases:
      - name: "small"
        dataset-parameters:
          generated:
            rows: { value: 50 }
execution-policies:
  controlled:
    version: 1
    cpus: 1
    threads: 1
    memory: "8 GiB"
    network: false
    worker-reuse: false
    warmup-runs: 1
    timeout: "10 min"
    timing-scope: "prepare_and_execute"
    primary-time: "timed_wall_time"
    run-order: "randomized"
    max-concurrency: 2
    enforcement: "best_effort"
observation-policies:
  final:
    version: 1
    kind: "one_shot"
