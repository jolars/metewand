version = 1
name = "regression"
family = "optimization"
parameter_schema = "schemas/parameters.json"
dataset_schemas = ["schemas/dataset.json"]
result_schema = "schemas/result.json"
metric_schema = "schemas/metrics.json"
semantics_schema = "schemas/semantics.json"
allowed_timing_scopes = ["cold_end_to_end", "prepare_and_execute"]
supported_budgets = ["none"]

[semantics.objective]
family = "squared_error"

[semantics.validity]
nonfinite = "reject"

[semantics.one_shot_completion]
maximum_error = 1e-8

[[reference_cases]]
dataset = "fixtures/small/dataset"
result = "fixtures/small/result"
expected_metrics = "fixtures/small/metrics.json"
