version: 1
name: "argmin"
family: "arithmetic"
parameter-schema: "schemas/parameters.json"
dataset-schemas: ["schemas/dataset.json"]
result-schema: "schemas/result.json"
metric-schema: "schemas/metrics.json"
semantics-schema: "schemas/semantics.json"
allowed-timing-scopes: ["prepare_and_execute"]
supported-budgets: ["none"]
semantics:
  computation:
    operation: "minimum"
    input_file: "data.json"
    input_field: "values"
    input_domain: "nonempty_finite_number_array"
    result_field: "value"
  preprocessing:
    values: "preserve_values_and_order"
    allowed_outside_timed_scope: []
  validity:
    index_base: 0
    ties: "first_minimum"
    index: "in_bounds_and_minimal"
  one_shot_completion:
    absolute_error: 0
reference-cases:
  - dataset: "fixtures/ties/dataset"
    result: "fixtures/ties/result"
    expected-metrics: "fixtures/ties/metrics/metrics.json"
  - dataset: "fixtures/unique/dataset"
    result: "fixtures/unique/result"
    expected-metrics: "fixtures/unique/metrics/metrics.json"
