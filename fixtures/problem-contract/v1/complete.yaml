version: 1
name: "regression"
family: "optimization"
parameter-schema: "schemas/parameters.json"
dataset-schemas: ["schemas/dataset.json"]
result-schema: "schemas/result.json"
metric-schema: "schemas/metrics.json"
semantics-schema: "schemas/semantics.json"
allowed-timing-scopes: ["cold_end_to_end", "prepare_and_execute"]
supported-budgets: ["none"]
semantics:
  objective:
    family: "squared_error"
  validity:
    nonfinite: "reject"
  one_shot_completion:
    maximum_error: 1e-8
reference-cases:
  - result: "fixtures/small/result"
    dataset: "fixtures/small/dataset"
    expected-metrics: "fixtures/small/metrics.json"
