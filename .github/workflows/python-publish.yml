name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Python release tag to publish (for example, metewand-v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: python-publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'metewand-v')
    uses: ./.github/workflows/python-package.yml
    with:
      ref: ${{ format('refs/tags/{0}', inputs.tag || github.event.release.tag_name) }}
      release-tag: ${{ inputs.tag || github.event.release.tag_name }}

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/metewand/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
