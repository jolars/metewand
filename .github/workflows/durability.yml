name: Durability

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  crash-campaign:
    name: Exhaustive crash campaign (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 120 || 60 }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Exercise every durability boundary
        run: >-
          cargo test --test integration --locked
          runtime::run_store::fault_tests::every_durability_boundary_survives_process_death_and_resume
          -- --exact --ignored --nocapture
      - name: Exercise every cache collection boundary
        run: >-
          cargo test --test integration --locked
          runtime::artifact_store::maintenance::tests::collection_recovers_after_each_database_sync_rename_and_cleanup_boundary
          -- --exact --ignored --nocapture
      - name: Exercise every archive publication boundary
        run: >-
          cargo test --test integration --locked
          runtime::archive::tests::every_archive_publication_boundary_survives_process_death
          -- --exact --ignored --nocapture
      - uses: actions/setup-python@v7
        if: runner.os != 'Windows'
        with:
          python-version: '3.14'
      - name: Stress concurrent result reporting
        if: runner.os != 'Windows'
        run: >-
          cargo test --test integration --locked
          cli_tests::concurrency::large_concurrent_results_are_reported_in_all_output_formats
          -- --exact --ignored --nocapture
