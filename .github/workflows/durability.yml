name: Durability

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/durability.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/runtime/artifact_store.rs
      - src/runtime/artifact_store/**
      - src/runtime/archive.rs
      - src/runtime/archive/**
      - src/runtime/evidence.rs
      - src/runtime/durability.rs
      - src/runtime/fault_injection.rs
      - src/runtime/local_tree.rs
      - src/runtime/platform_fs.rs
      - src/runtime/publication.rs
      - src/runtime/run_store.rs
      - src/runtime/run_store/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  crash-campaign:
    name: Exhaustive crash campaign (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Exercise every durability boundary
        run: >-
          cargo test --test integration --locked
          runtime::run_store::fault_tests::every_durability_boundary_survives_process_death_and_resume
          -- --exact --ignored --nocapture
      - name: Exercise every cache collection boundary
        run: >-
          cargo test --test integration --locked
          runtime::artifact_store::maintenance::tests::collection_recovers_after_each_database_sync_rename_and_cleanup_boundary
          -- --exact --ignored --nocapture
