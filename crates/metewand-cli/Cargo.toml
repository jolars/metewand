[package]
name = "metewand-cli"
description = "Command-line interface for Metewand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[package.metadata.dist]
# Distribute the CLI even though the workspace is not published to crates.io.
dist = true

[[bin]]
name = "metewand"
path = "src/main.rs"

[dependencies]
metewand-core.workspace = true
metewand-protocol.workspace = true
metewand-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde-saphyr.workspace = true
sha2.workspace = true
tempfile.workspace = true
