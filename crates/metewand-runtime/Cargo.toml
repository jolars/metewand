[package]
name = "metewand-runtime"
description = "Artifact, environment, executor, and provenance support for Metewand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
flate2.workspace = true
getrandom.workspace = true
globset.workspace = true
metewand-core.workspace = true
metewand-protocol.workspace = true
reqwest.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
yaml-edit.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["trace"] }

[[example]]
name = "datamonger"
path = "../../examples/datamonger/main.rs"

[[example]]
name = "rust-worker"
path = "../../examples/rust-worker/main.rs"

[[example]]
name = "buffered-worker"
path = "../../examples/buffered-profile/main.rs"

[[example]]
name = "overhead-worker"
path = "../../examples/overhead/main.rs"
