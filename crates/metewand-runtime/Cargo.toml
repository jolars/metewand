[package]
name = "metewand-runtime"
description = "Artifact, environment, executor, and provenance support for Metewand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
flate2.workspace = true
globset.workspace = true
libc = "0.2"
metewand-core.workspace = true
metewand-protocol.workspace = true
reqwest.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml_edit.workspace = true

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["trace"] }

[[example]]
name = "datamonger"
path = "../../examples/datamonger/main.rs"
