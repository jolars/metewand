implementations:
  solver:
    parameters:
      max_iterations: { type: integer, minimum: 1, default: 1000 }
      tolerance: { type: number, exclusiveMinimum: 0, default: 1e-6 }

problems:
  lasso:
    contract:
      parameters:
        lambda: { type: number, minimum: 0 }
      result-fields:
        coefficients: { type: array, items: { type: number } }
        intercept: number
      metrics:
        objective: number
        kkt_violation: { type: number, minimum: 0 }
